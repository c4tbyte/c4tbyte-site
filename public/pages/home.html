<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C4TBYTE</title>
  <link rel="stylesheet" href="/theme.css" />

  <style>
  .hero {
    position: relative;
    overflow: hidden;
    background: var(--color-bg);
    padding: 64px 34px 96px;
    min-height: 480px;
  }
  
  .hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 55%;
    height: 100%;
    background-image: url("/images/hero-binary.png");
    background-repeat: no-repeat;
    background-position: left top;
    background-size: contain;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  
  .hero::after {
    content: "";
    position: absolute;
    top: 50%;
    right: -180px;
    transform: translateY(-50%);
    width: 640px;
    height: 640px;
    background-image: url("/images/hero-globe.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    pointer-events: none;
    z-index: 0;
  }
  
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 640px;
  }
  
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-fg);
    margin: 0 0 16px;
  }
  
  .hero-heading {
    font-family: var(--font-nav);
    font-weight: 400;
    letter-spacing: 0.02em;
    font-size: clamp(32px, 5vw, 56px);
    line-height: 1.1;
    text-transform: uppercase;
    margin: 0 0 20px;
  }
  
  .hero-subtext {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    color: #cfcfcf;
    max-width: 460px;
    margin: 0;
  }
  
  .hero-photo {
    position: relative;
    z-index: 3; /* above the globe */
    display: inline-block;
    background: #f4f4f4;
    padding: 12px 12px 40px;
    transform: rotate(-4deg);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    margin-top: 32px;
  }
  
  .hero-photo img {
    display: block;
    width: 260px;
    height: auto;
  }

  @media (min-width: 900px) {
    .hero {
      display: flex;
      align-items: center;
      gap: 60px;
      padding: 64px 34px;
    }
  
    .hero-photo {
      margin-top: 0;
      flex-shrink: 0;
    }
  }
  </style>

</head>
<body>

  <!-- Nav mount-->
  <div data-site-nav></div>

  <!-- Page content -->
  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="hero-eyebrow">Sup, I'm Iris.</p>
        <h1 class="hero-heading">I turn creative ideas<br />into working technology.</h1>
        <p class="hero-subtext">Web, software, systems, and automation built for the music world.</p>
      </div>
 
      <div class="hero-photo">
        <img src="/images/hero-photo.jpg" alt="Iris" />
      </div>
    </section>
  </main>

  <script src="/components/helpers/text-helper.js" defer></script>
  <script src="/components/simple-nav.js" defer></script>
  <script src="/components/helpers/nav-helper.js" defer></script>

</body>
</html>
